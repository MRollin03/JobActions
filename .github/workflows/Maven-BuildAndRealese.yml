name: Build and Release Minecraft Plugin - Maven

on:
  push:
    branches:
      - "publish"
    tags:
      - "v*" # Trigger the workflow on new version tags
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Updated to v4

      - name: Set up Java
        uses: actions/setup-java@v4  # Updated to v4
        with:
          distribution: 'temurin'  # Use Temurin JDK (formerly AdoptOpenJDK)
          java-version: '21'       # Set your desired Java version here

      - name: Build with Maven
        run: mvn clean package

      - name: Archive built jar
        uses: actions/upload-artifact@v4  # Updated to v4
        with:
          name: minecraft-plugin
          path: target/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'  # Only run on tags (i.e., version releases)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to Bukkit/CurseForge
        run: |
          FILE=$(ls target/*.jar | head -n 1)
          
          # Create metadata JSON (adjust releaseType, gameVersions, etc. as needed)
          cat > metadata.json <<EOF
          {
            "changelog": "Automated release from GitHub Actions: ${{ github.ref_name }}",
            "changelogType": "markdown",
            "displayName": "Automated Test Release ${{ github.ref_name }}",
            "releaseType": "release",
            "gameVersions": [1.20.1]  # Replace with actual supported version IDs
          }
          EOF
          
          // Upload to curseForge using Project ID and API key from github secrets
          curl -X POST \
            -H "X-Api-Token: ${{ secrets.BUKKIT_ORG }}" \
            -F "metadata=@metadata.json" \
            -F "file=@${FILE}" \
            "https://dev.bukkit.org/api/projects/${{secrets.PROJECT_ID}}/upload-file"
